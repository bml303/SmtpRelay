[project]
name = "smtp-relay"
version = "0.3.4-rc.1"
description = "REST-to-SMTP relay: validates JSON against a schema, allowlists recipient domains, and delivers via a configurable mailhost over STARTTLS or implicit TLS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # Plain uvicorn, deliberately NOT uvicorn[standard]. The extra pulls in
    # httptools, PyYAML, watchfiles, websockets, python-dotenv and uvloop - none
    # of which this relay uses (config is TOML, there is no --reload, no
    # WebSocket endpoint and no .env file). PyYAML in particular has no
    # win_amd64 wheel for cp3.15 and no win_arm64 wheel for cp3.11, so it forces
    # a Visual Studio C++ Build Tools install on Windows to compile a module
    # that is never imported. Without the extra, the only compiled dependencies
    # left are pydantic-core and pywin32, both of which have complete wheels.
    "uvicorn>=0.30",
    "pydantic[email]>=2.7",
    # PKCS#12 and Windows certificate store sources for the API certificate
    # (app/tls.py). Capped below 47 because 47+ has no win_arm64 wheel.
    "cryptography>=46,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # Real SMTP sink used by tests/test_integration.py.
    "aiosmtpd>=1.4.6",
]
# Native Windows service support (app/windows_service.py). The marker keeps
# this a no-op on Linux/macOS, so `pip install '.[dev,windows]'` is safe anywhere.
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/bml303/SmtpRelay"
Source = "https://github.com/bml303/SmtpRelay"
Releases = "https://github.com/bml303/SmtpRelay/releases"

[build-system]
# >= 77 for the PEP 639 `license` / `license-files` keys above.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-q"
