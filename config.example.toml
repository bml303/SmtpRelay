# SMTP relay configuration.
#
# Every value can be overridden by an environment variable; env wins over this
# file. Keep secrets in the environment, not here. See README.md for the full
# list of RELAY_* variables.

[api]
# Loopback by default: nothing off this machine can reach the API.
# Binding anything else (0.0.0.0, ::, a LAN address) makes the service
# network-reachable, and the app then REFUSES TO START unless both are set:
#   1. ssl_certfile            - otherwise the bearer token and message bodies
#                                cross the network in cleartext
#   2. token, or ssl_cert_reqs = "required"
#                              - otherwise any host that can reach the port can
#                                relay mail, i.e. an open relay
# That check runs in AppConfig, so no entry point can bypass it.
host = "127.0.0.1"
port = 8000
# Optional on loopback; REQUIRED (or mTLS) when api.host is not loopback.
# Prefer RELAY_API_TOKEN over writing the token into this file.
# token = "change-me"
max_recipients = 50

# Inbound TLS for the REST API itself. Off by default: with api.host bound to
# 127.0.0.1 the API is loopback-only and never crosses the network, so TLS buys
# nothing. Enable it when remote clients connect directly (i.e. you are not
# terminating TLS in a reverse proxy in front of this service).
# Any ONE of the three certificate sources switches the endpoint to HTTPS. The
# certificate's SAN must match the hostname clients use, or their TLS
# verification will fail.
#
# 1. PEM files:
# ssl_certfile = "/etc/ssl/certs/smtp-relay.crt"
# ssl_keyfile = "/etc/ssl/private/smtp-relay.key"
# Passphrase for an encrypted key. Prefer RELAY_API_SSL_KEYFILE_PASSWORD.
# ssl_keyfile_password = ""
#
# 2. A PKCS#12 (.pfx / .p12) file with certificate, chain and key:
# ssl_pfxfile = "/etc/ssl/private/smtp-relay.pfx"
# Prefer RELAY_API_SSL_PFX_PASSWORD over writing the passphrase here.
# ssl_pfx_password = ""
#
# 3. Windows only: a certificate in the machine store (certlm.msc > Personal),
#    identified by its SHA-1 thumbprint. install.ps1 -PfxPath fills this in and
#    grants the service account access to the key, which must be exportable.
# ssl_cert_thumbprint = "0123456789ABCDEF0123456789ABCDEF01234567"
# Mutual TLS: verify clients against this CA bundle.
# ssl_ca_certs = "/etc/ssl/certs/client-ca.pem"
# "none" | "optional" | "required"; mapped to ssl.VerifyMode for uvicorn.
# ssl_cert_reqs = "required"

# Behind a reverse proxy or ingress that terminates TLS on a private network
# (the usual container deployment), the app must bind 0.0.0.0 but should not
# serve TLS itself. This waives ONLY the TLS half of the rule above: token (or
# mTLS at the proxy is invisible here, so token) is still required, because a
# proxy does not stop anyone who can reach it from relaying mail. Mutually
# exclusive with ssl_certfile. Prefer RELAY_API_BEHIND_TLS_PROXY=true in the
# container environment over writing it here.
# behind_tls_proxy = false

[smtp]
host = "mail.example.com"
# 465 = implicit TLS, 587 = STARTTLS, 25 = usually plaintext
port = 587
# "starttls" | "tls" | "none". Omit to infer from the port above.
# security = "starttls"
# Both username and password, or neither: the relay authenticates only when a
# username is set, and refuses to start with a password alone.
# username = "relay@example.com"
# Password: use RELAY_SMTP_PASSWORD rather than this file.
# password = ""
timeout = 30.0
# Extra CA bundle for an internal PKI. Omit to use the system trust store.
# ca_file = "/etc/ssl/certs/internal-ca.pem"
# Name sent in EHLO/HELO. Defaults to the local FQDN.
# local_hostname = "relay.example.com"

[policy]
sender = "relay@example.com"
# sender_name = "Notification Relay"
# Recipient domains permitted by POST /mail. Empty = reject everything.
allowed_domains = ["example.com", "example.org"]
# When true, an entry also covers its subdomains (mail.example.com).
allow_subdomains = false
# Reject subjects/bodies that look like base64 blobs rather than plain text.
reject_base64 = true
