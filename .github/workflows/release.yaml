# Release pipeline: runs on every `vX.Y.Z` tag.
#
#   tests  ->  payloads  (Windows zips, Linux tarballs, one CycloneDX SBOM per payload,
#                         SHA256SUMS, attached to the GitHub release)
#          ->  image     (multi-arch container pushed to ghcr.io/<owner>/smtprelay:vX.Y.Z,
#                         plus a syft SBOM per architecture attached to the same release)
#
# The tag is the source of truth. If it does not match pyproject.toml the run
# fails before downloading anything, so an artefact can never carry a version
# its own /health endpoint denies. Release notes are the annotated tag's
# message (scripts/release.py notes). A pre-release tag (vX.Y.Z-rc.1) is
# published as a GitHub pre-release and never moves the `latest` image tag.
#
# Every step is idempotent: re-running a failed job updates the release and
# replaces assets of the same name instead of duplicating them. The automatic
# token is enough for everything - releases need `contents: write`, the
# registry `packages: write` - so the repository needs no secrets at all.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tag must match pyproject.toml
        run: python scripts/release.py check-version --tag "$GITHUB_REF_NAME"
      - name: Test
        run: python -m pytest

  payloads:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release.py notes reads the tag annotation and the previous tag.
          fetch-depth: 0
      - name: Fetch the annotated tag object
        # actions/checkout resolves the ref to its commit and leaves a
        # lightweight tag behind; the annotation (the release notes) is only
        # there after fetching the tag object itself.
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build requirements
        # build_dist.py needs `packaging` (markers, Requires-Dist); a bare
        # runner has only pip.
        run: python -m pip install packaging

      - name: PowerShell is available
        # build_dist.py syntax-checks install.ps1/uninstall.ps1 with the real
        # PowerShell parser; without pwsh it only warns, and a parse error
        # would then reach the target machine. GitHub's Ubuntu runners ship it.
        run: pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Build win_amd64 payload
        run: python scripts/build_dist.py --no-bump --platform win_amd64 --zip
      - name: Build win_arm64 payload
        run: python scripts/build_dist.py --no-bump --platform win_arm64 --zip
      - name: Build linux_x86_64 payload
        # bash -n and systemd-analyze verify run here; the runner has both.
        run: python scripts/build_dist.py --no-bump --platform linux_x86_64 --zip
      - name: Build linux_aarch64 payload
        run: python scripts/build_dist.py --no-bump --platform linux_aarch64 --zip

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum SmtpRelay-*.zip SmtpRelay-*.tar.gz SmtpRelay-*.cdx.json | tee SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          title="SMTP Relay $version"
          python scripts/release.py notes --tag "$tag" > dist/NOTES.md
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$tag" --json id >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file dist/NOTES.md "${prerelease[@]}"
          else
            gh release create "$tag" --verify-tag --title "$title" --notes-file dist/NOTES.md "${prerelease[@]}"
          fi
          gh release upload "$tag" --clobber \
            dist/SmtpRelay-*.zip dist/SmtpRelay-*.tar.gz dist/SmtpRelay-*.cdx.json dist/SHA256SUMS

  image:
    # After payloads: both jobs touch the same release, and only the payloads
    # job creates it, so the SHA256SUMS fold below always finds it.
    needs: [tests, payloads]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image coordinates
        # Image references must be lowercase; the repository owner may not be.
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/smtprelay"
          version="${GITHUB_REF_NAME#v}"
          # A pre-release (vX.Y.Z-rc.1) must never move the `latest` tag.
          case "$version" in
            *-*) tags="$image:v$version" ;;
            *)   tags="$image:v$version"$'\n'"$image:latest" ;;
          esac
          {
            echo "IMAGE=$image"
            echo "VERSION=$version"
            echo "IMAGE_TAGS<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Image SBOMs (syft, one per architecture)
        # The payload SBOMs come from build_dist.py, which knows every wheel it
        # bundled. The image additionally carries Debian packages from the base
        # image, which only a scanner of the finished image can see. Pinned to
        # CycloneDX 1.6 so all six documents of a release share one schema
        # version (syft defaults to the newest it knows).
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          mkdir -p dist
          for arch in amd64 arm64; do
            syft "registry:${IMAGE}:v${VERSION}" --platform "linux/${arch}" \
              -o "cyclonedx-json@1.6=dist/SmtpRelay-${VERSION}-image-${arch}.cdx.json"
          done

      - name: Attach image SBOMs to the release
        # SHA256SUMS was written by the payloads job before these files existed;
        # fetch it from the release, append the image SBOM lines, and replace it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir dist --clobber
          grep -v -- '-image-' dist/SHA256SUMS > dist/SHA256SUMS.new
          (cd dist && sha256sum SmtpRelay-*-image-*.cdx.json) >> dist/SHA256SUMS.new
          mv dist/SHA256SUMS.new dist/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --clobber dist/SmtpRelay-*-image-*.cdx.json dist/SHA256SUMS
